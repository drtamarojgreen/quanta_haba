[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta-haba"
version = "1.0.0"
authors = [
  { name="QuantaHaba Team", email="info@quantahaba.org" },
]
description = "An LLM-powered design editor with structured authoring."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "requests",
    "requests-oauthlib",
    "keyring",
]

[project.urls]
"Homepage" = "https://github.com/quantahaba/quantahaba"
"Bug Tracker" = "https://github.com/quantahaba/quantahaba/issues"

[tool.setuptools]
package-dir = {"" = "src/p"}
packages = ["."]
include-package-data = true

[project.scripts]
haba-editor = "editor:main"
